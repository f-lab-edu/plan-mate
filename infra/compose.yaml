name: planmate-local

services:
  postgres:
    image: postgres:17
    container_name: planmate-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planmate}
      POSTGRES_USER: ${POSTGRES_USER:-planmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planmate}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planmate} -d ${POSTGRES_DB:-planmate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: planmate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    container_name: planmate-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-planmate}
      DB_USERNAME: ${POSTGRES_USER:-planmate}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-planmate}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: planmate-nginx
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  redis-data:
