name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build backend
        run: ./gradlew build --no-daemon

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        if: ${{ hashFiles('frontend/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run build
        working-directory: frontend

      - name: Lint frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm run lint
        working-directory: frontend

  infra:
    name: Infra config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        if: ${{ hashFiles('infra/compose.yaml') != '' }}
        run: docker compose --env-file infra/.env.example -f infra/compose.yaml config
